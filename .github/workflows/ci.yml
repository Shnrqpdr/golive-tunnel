name: ci

# Checks every change on a real Windows: a broken test shows up here, and not on a friend's
# computer after the package was already sent.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # One step per command: in a single step, the first failure would hide behind the last
      # command's success, because the shell returns the exit code of the last line.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet for Windows
        run: GOOS=windows go vet ./...

      - name: Portable tests
        run: go test ./...

      - name: shellcheck
        run: shellcheck server/install.sh server/golive-peer server/golive-delegate-login scripts/build.sh
