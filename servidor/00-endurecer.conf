# Endurecimento do VPS do tunel do DiscordGoLiveBypass. Fica em 00- porque o sshd usa o
# primeiro valor que encontra, e este arquivo e lido antes do resto da configuracao.

# So chave, nunca senha. O root continua entrando, mas so com a chave de administrador.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password

# Sem o authorized_keys2, onde o /admin/sshkeyme da InterServer instala a chave do suporte
# deles. Para devolver esse acesso, apague esta linha e rode: systemctl restart ssh
AuthorizedKeysFile .ssh/authorized_keys
