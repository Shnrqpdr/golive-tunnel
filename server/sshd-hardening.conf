# Optional SSH hardening for the golive-tunnel server, installed by hand as
# /etc/ssh/sshd_config.d/00-golive-hardening.conf. It starts with 00- because sshd keeps the
# first value it finds, and this file is read before the rest of the configuration.
#
# Before installing, make sure you can log in with a key: password login stops working.

# Keys only, never passwords. root still logs in, but only with the administrator's key.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password

# Ignore authorized_keys2, where some providers (InterServer, for one) install their support
# team's key. To give that access back, delete this line and run: systemctl restart ssh
AuthorizedKeysFile .ssh/authorized_keys
